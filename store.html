<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gram's Holler — Storefront</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--gh-paper); }
  /* faint paper grain across the whole storefront */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
    background-image: radial-gradient(rgba(92,63,42,0.045) 1px, transparent 1px);
    background-size: 4px 4px;
  }
  #root { position: relative; z-index: 1; }
  a { color: var(--gh-dusk); }

  /* Brand-compliant "Back to Home" link styling */
  .back-home-badge {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Bitter', serif;
    font-size: 0.9rem;
    color: var(--gh-text-walnut, #2C2014);
    text-decoration: none;
    background-color: var(--gh-bg-card, #FBF4E2);
    padding: 8px 16px;
    border: 1px dashed rgba(44, 32, 20, 0.3);
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(44, 32, 20, 0.05);
    transition: all 0.2s ease;
  }

  .back-home-badge:hover {
    color: var(--gh-accent-barn, #9E3A24);
    border-color: var(--gh-accent-barn, #9E3A24);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(44, 32, 20, 0.08);
  }
</style>
</head>
<body>
  <!-- Floating Return Link placed at the top left of the layout -->
  <a href="index.html" class="back-home-badge">
    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
    <span>Back to main page</span>
  </a>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="./ui_kits/storefront/ui.jsx"></script>
  <script type="text/babel" src="./ui_kits/storefront/catalog.jsx"></script>
  <script type="text/babel" src="./ui_kits/storefront/chrome.jsx"></script>
  <script type="text/babel" src="./ui_kits/storefront/detail.jsx"></script>
  <script type="text/babel" src="./ui_kits/storefront/app.jsx"></script>

  <!-- Script to initialize the Lucide icon inside the badge -->
  <script type="text/javascript">
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
