<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 78px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid rgba(44,32,20,0.10); }
  .nm { font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--gh-ink); margin-top: 7px; }
  .hex { font-family: var(--font-heading); font-size: 11px; color: var(--gh-oak); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:#F3E8CF"></div><div class="nm">Paper</div><div class="hex">#F3E8CF</div></div>
  <div class="sw"><div class="chip" style="background:#FBF4E2"></div><div class="nm">Paper warm</div><div class="hex">#FBF4E2</div></div>
  <div class="sw"><div class="chip" style="background:#D8C19A"></div><div class="nm">Kraft</div><div class="hex">#D8C19A</div></div>
  <div class="sw"><div class="chip" style="background:#8A6240"></div><div class="nm">Oak</div><div class="hex">#8A6240</div></div>
  <div class="sw"><div class="chip" style="background:#5C3F2A"></div><div class="nm">Bark</div><div class="hex">#5C3F2A</div></div>
  <div class="sw"><div class="chip" style="background:#2C2014"></div><div class="nm">Walnut ink</div><div class="hex">#2C2014</div></div>
</body>
</html>
