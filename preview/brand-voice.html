<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; align-items: center; gap: 24px; }
  .tag {
    position: relative; background: var(--gh-kraft);
    border: 1.5px dashed rgba(44,32,20,0.35); border-radius: var(--radius-tag);
    padding: 18px 22px 18px 30px; width: 290px; flex: none;
    box-shadow: var(--shadow-md);
  }
  .tag::before {
    content: ""; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: var(--gh-paper);
    box-shadow: inset 0 0 0 1.5px rgba(44,32,20,0.4);
  }
  .tag .eb { font-family: var(--font-heading); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gh-barn); }
  .tag .hand { font-family: var(--font-hand); font-size: 27px; color: var(--gh-walnut); line-height: 1.15; margin-top: 4px; }
  .notes { flex: 1; }
  .notes p { font-family: var(--font-body); font-size: 16px; color: var(--gh-bark); margin: 0 0 10px; line-height: 1.5; }
  .notes .lbl { font-family: var(--font-heading); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gh-oak); display:block; margin-bottom: 6px; }
  .notes em { color: var(--gh-ink); font-style: italic; }
</style>
</head>
<body class="card-grain">
  <div class="tag">
    <div class="eb">From the workshop</div>
    <div class="hand">It'll outlive the both of us.</div>
  </div>
  <div class="notes">
    <span class="lbl">Voice — Gram on the porch</span>
    <p>Warm, plain-spoken, unhurried. We talk to <em>you</em>; we sign as <em>we</em>. Sentence case, short sentences, a little folksy rhythm.</p>
    <p>Never salesy, never corporate, no emoji. The craft speaks for itself.</p>
  </div>
</body>
</html>
