<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid rgba(44,32,20,0.10); }
  .nm { font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--gh-ink); margin-top: 7px; }
  .role { font-family: var(--font-body); font-size: 11px; color: var(--gh-oak); }
  .hex { font-family: var(--font-heading); font-size: 11px; color: var(--gh-oak); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:#9E3A24"></div><div class="nm">Barn red</div><div class="role">primary action</div><div class="hex">#9E3A24</div></div>
  <div class="sw"><div class="chip" style="background:#C25E38"></div><div class="nm">Clay</div><div class="role">hover</div><div class="hex">#C25E38</div></div>
  <div class="sw"><div class="chip" style="background:#7A2A18"></div><div class="nm">Ember</div><div class="role">pressed</div><div class="hex">#7A2A18</div></div>
  <div class="sw"><div class="chip" style="background:#C8902C"></div><div class="nm">Goldenrod</div><div class="role">accent</div><div class="hex">#C8902C</div></div>
  <div class="sw"><div class="chip" style="background:#DEBB5E"></div><div class="nm">Wheat</div><div class="role">highlight</div><div class="hex">#DEBB5E</div></div>
</body>
</html>
