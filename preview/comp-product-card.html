<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; gap: 20px; align-items: stretch; }
  .pcard { width: 250px; background: var(--gh-paper-warm); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); overflow: hidden; display: flex; flex-direction: column; }
  .ph { height: 150px; background:
      repeating-linear-gradient(100deg, #c9ad7e 0 14px, #c4a675 14px 28px);
    position: relative; display: grid; place-items: center; }
  .ph span { font-family: var(--font-hand); font-size: 17px; color: rgba(44,32,20,0.5); }
  .badge { position: absolute; top: 10px; left: 10px; font-family: var(--font-heading); font-weight: 700; font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: var(--radius-sm); background: var(--gh-barn); color: var(--gh-paper-warm); }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .eb { font-family: var(--font-heading); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gh-oak); }
  .ttl { font-family: var(--font-heading); font-weight: 700; font-size: 19px; color: var(--gh-ink); }
  .desc { font-family: var(--font-body); font-size: 13.5px; color: var(--gh-bark); line-height: 1.45; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; }
  .price { font-family: var(--font-heading); font-weight: 700; font-size: 20px; color: var(--gh-ink); }
  .add { font-family: var(--font-heading); font-weight: 600; font-size: 13px; background: var(--gh-barn); color: var(--gh-paper-warm); border: none; border-radius: var(--radius-md); padding: 8px 14px; cursor: pointer; }
  .note { align-self: center; }
  .note p { font-family: var(--font-body); font-size: 13px; color: var(--gh-oak); max-width: 200px; line-height: 1.5; }
  .note .l { font-family: var(--font-heading); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gh-oak); display:block; margin-bottom:6px; }
</style>
</head>
<body>
  <div class="pcard">
    <div class="ph"><span>your photo here</span><span class="badge">Only 2 left</span></div>
    <div class="body">
      <span class="eb">Woodwork</span>
      <span class="ttl">Walnut serving spoon</span>
      <span class="desc">Carved by hand, rubbed with beeswax. It'll outlive the both of us.</span>
      <div class="foot"><span class="price">$38</span><button class="add">Add to basket</button></div>
    </div>
  </div>
  <div class="note">
    <span class="l">Product card</span>
    <p>1px oak border + soft warm shadow on paper-cream. Lifts 2px on hover. Photo placeholders use a woodgrain tone until real shots are dropped in.</p>
  </div>
</body>
</html>
