<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; align-items: center; gap: 26px; }
  .mark { width: 116px; height: 116px; flex: none; }
  .mark img { width: 100%; height: 100%; display: block; }
  .word { line-height: 0.9; }
  .word .gh { font-family: var(--font-display); font-size: 30px; color: var(--gh-bark); letter-spacing: 0.01em; }
  .word .name { font-family: var(--font-display); font-size: 52px; color: var(--gh-barn); display: block; margin-top: 2px; }
  .word .tag { font-family: var(--font-hand); font-size: 26px; color: var(--gh-moss); margin-top: 4px; }
</style>
</head>
<body class="card-grain">
  <div class="mark"><img src="../assets/logo-mark.svg" alt="Gram's Holler emblem"></div>
  <div class="word col">
    <span class="name">Gram's Holler</span>
    <span class="tag">made slow, made to last</span>
  </div>
</body>
</html>
