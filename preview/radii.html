<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 90px; height: 70px; background: var(--gh-linen); border: 1.5px solid var(--gh-oak); }
  .nm { font-family: var(--font-heading); font-weight: 600; font-size: 12px; color: var(--gh-ink); margin-top: 8px; }
  .v { font-family: var(--font-heading); font-size: 11px; color: var(--gh-oak); }
</style>
</head>
<body class="card-grain">
  <div class="item"><div class="box" style="border-radius:3px"></div><div class="nm">sm</div><div class="v">3px</div></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">md</div><div class="v">6px</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="nm">lg</div><div class="v">10px</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="nm">xl</div><div class="v">16px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="nm">round</div><div class="v">chips only</div></div>
</body>
</html>
