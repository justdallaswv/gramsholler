<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid rgba(44,32,20,0.10); }
  .nm { font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--gh-ink); margin-top: 7px; }
  .role { font-family: var(--font-body); font-size: 11px; color: var(--gh-oak); }
  .hex { font-family: var(--font-heading); font-size: 11px; color: var(--gh-oak); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="sw"><div class="chip" style="background:#354029"></div><div class="nm">Holler</div><div class="role">secondary</div><div class="hex">#354029</div></div>
  <div class="sw"><div class="chip" style="background:#586B3A"></div><div class="nm">Moss</div><div class="role">success</div><div class="hex">#586B3A</div></div>
  <div class="sw"><div class="chip" style="background:#8C9A6B"></div><div class="nm">Sage</div><div class="role">soft green</div><div class="hex">#8C9A6B</div></div>
  <div class="sw"><div class="chip" style="background:#5E7173"></div><div class="nm">Dusk</div><div class="role">info · sparing</div><div class="hex">#5E7173</div></div>
</body>
</html>
