<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; gap: 0; padding: 0; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 26px 0; }
  .on-dark { background: var(--gh-holler); }
  .on-clay { background: var(--gh-barn); }
  .on-paper { background: var(--gh-paper); }
  .mark { width: 72px; height: 72px; }
  .mark img { width: 100%; height: 100%; }
  .wm { font-family: var(--font-display); font-size: 22px; line-height: 1; }
  .light .wm { color: var(--gh-paper-warm); }
  .clay .wm { color: var(--gh-paper-warm); }
  .dark .wm { color: var(--gh-barn); }
  .lbl { font-family: var(--font-heading); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .light .lbl { color: rgba(251,244,226,0.6); }
  .clay .lbl { color: rgba(251,244,226,0.7); }
  .dark .lbl { color: var(--gh-oak); }
</style>
</head>
<body>
  <div class="panel on-paper dark">
    <div class="mark"><img src="../assets/logo-mark.svg" alt=""></div>
    <div class="wm">Gram's Holler</div>
    <div class="lbl">on paper</div>
  </div>
  <div class="panel on-dark light">
    <div class="mark"><img src="../assets/logo-mark.svg" alt=""></div>
    <div class="wm">Gram's Holler</div>
    <div class="lbl">on holler green</div>
  </div>
  <div class="panel on-clay clay">
    <div class="mark"><img src="../assets/logo-mark.svg" alt=""></div>
    <div class="wm">Gram's Holler</div>
    <div class="lbl">on barn red</div>
  </div>
</body>
</html>
