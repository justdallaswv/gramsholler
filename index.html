<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram's Holler — Authentic Rustic Goods, Made by Hand</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="colors_and_type.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Baseline Layout aligned to Gram's Holler Spec */
        body {
            background-color: var(--gh-paper, #F3E8CF);
            color: var(--gh-text-walnut, #2C2014);
            font-family: 'Spectral', serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation - Centered and cleanly spaced for the new link */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            justify-content: center; 
            align-items: center;
            border-bottom: 1px dashed rgba(44, 32, 20, 0.15);
        }

        nav {
            display: flex;
            gap: 28px; /* Balanced spacing to fit all links comfortably */
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            font-family: 'Bitter', serif;
            color: var(--gh-text-walnut, #2C2014);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--gh-accent-barn, #9E3A24);
        }

        /* Hero Section */
        .hero {
            max-width: 800px;
            margin: 64px auto 48px auto;
            text-align: center;
            padding: 0 16px;
        }

        .hero-logo-container {
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
        }

        .hero-logo-image {
            height: 200px; 
            width: auto;
            object-fit: contain;
        }

        .eyebrow {
            font-family: 'Bitter', serif;
            font-size: 0.9rem;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            color: var(--gh-accent-barn, #9E3A24);
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Bitter', serif;
            font-size: 3rem;
            line-height: 1.2;
            margin: 0 0 24px 0;
            font-weight: 400;
        }

        .lead-text {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto 40px auto;
            color: rgba(44, 32, 20, 0.85);
        }

        /* Coming Soon / Store Notice Tag */
        .store-notice-tag {
            background-color: var(--gh-bg-card, #FBF4E2);
            border: 1px dashed rgba(44, 32, 20, 0.3);
            border-radius: 6px;
            padding: 24px;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 4px 12px rgba(44, 32, 20, 0.05);
        }

        .tag-handwriting {
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            color: var(--gh-accent-goldenrod, #C8902C);
            margin-bottom: 8px;
        }

        .store-notice-tag p {
            margin: 0 0 16px 0;
            font-size: 1rem;
            text-align: left;
            line-height: 1.5;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Bitter', serif;
            background: transparent;
            border: 1px solid var(--gh-text-walnut, #2C2014);
            color: var(--gh-text-walnut, #2C2014);
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: var(--gh-text-walnut, #2C2014);
            color: #F3E8CF;
            transform: translateY(-1px);
        }

        /* Showcase Heading */
        .section-title {
            text-align: center;
            font-family: 'Bitter', serif;
            font-size: 1.75rem;
            font-weight: 400;
            margin: 64px 0 16px 0;
        }

        /* Features / Product Grid */
        .features-grid {
            max-width: 1100px;
            margin: 0 auto 96px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            padding: 0 16px;
        }

        .feature-card {
            background-color: var(--gh-bg-card, #FBF4E2);
            border: 1px solid rgba(44, 32, 20, 0.1);
            border-radius: 6px;
            padding: 16px;
            text-align: left;
            text-decoration: none;
            color: var(--gh-text-walnut, #2C2014);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(44, 32, 20, 0.08);
            border-color: var(--gh-accent-moss, #354029);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 16px;
            background-color: rgba(44, 32, 20, 0.05);
        }

        .feature-card h3 {
            font-family: 'Bitter', serif;
            font-size: 1.15rem;
            margin: 0 0 8px 0;
            font-weight: 400;
        }

        .feature-card p {
            margin: 0;
            font-size: 0.95rem;
            color: rgba(44, 32, 20, 0.8);
            flex-grow: 1;
        }

        /* Ornament Divider */
        .ornament {
            text-align: center;
            color: var(--gh-accent-barn, #9E3A24);
            font-size: 1.2rem;
            margin: 64px 0 32px 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 48px 16px;
            border-top: 1px dashed rgba(44, 32, 20, 0.15);
            font-size: 0.9rem;
            color: rgba(44, 32, 20, 0.6);
        }
    </style>
</head>

        </nav>
