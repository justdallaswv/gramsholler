    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram's Holler — Authentic Rustic Goods, Made by Hand</title>

        /* Baseline Layout aligned to Gram's Holler Spec */
        body {
            background-color: var(--gh-bg-paper, #F3E8CF);
            color: var(--gh-text-walnut, #2C2014);
            font-family: 'Spectral', serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(44, 32, 20, 0.15);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--gh-text-walnut, #2C2014);
        }

        .logo-image {
            height: 64px; /* Increased from 48px for a slightly larger layout footprint */
            width: auto;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            font-family: 'Bitter', serif;
            color: var(--gh-text-walnut, #2C2014);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--gh-accent-barn, #9E3A24);
        }

        /* Hero Section */
        .hero {
            max-width: 800px;
            margin: 80px auto 48px auto;
            text-align: center;
            padding: 0 16px;
        }

        .eyebrow {
            font-family: 'Bitter', serif;
            font-size: 0.9rem;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            color: var(--gh-accent-barn, #9E3A24);
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Bitter', serif;
            font-size: 3rem;
            line-height: 1.2;
            margin: 0 0 24px 0;
            font-weight: 400;
        }

        .lead-text {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto 40px auto;
            color: rgba(44, 32, 20, 0.85);
        }

        /* Coming Soon / Store Notice Tag */
        .store-notice-tag {
            background-color: var(--gh-bg-card, #FBF4E2);
            border: 1px dashed rgba(44, 32, 20, 0.3);
            border-radius: 6px;
            padding: 24px;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 4px 12px rgba(44, 32, 20, 0.05);
        }

        .tag-handwriting {
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            color: var(--gh-accent-goldenrod, #C8902C);
            margin-bottom: 8px;
        }

        .store-notice-tag p {
            margin: 0 0 16px 0;
            font-size: 1rem;
            text-align: left;
            line-height: 1.5;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Bitter', serif;
            background: transparent;
            border: 1px solid var(--gh-text-walnut, #2C2014);
            color: var(--gh-text-walnut, #2C2014);
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
